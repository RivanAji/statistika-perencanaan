<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Distribusi jumlah angka dari empat lemparan koin adil</title>
  <desc id="desc">Diagram batang dengan peluang untuk nol sampai empat angka: 0,0625; 0,25; 0,375; 0,25; dan 0,0625. Peluang tertinggi adalah dua angka.</desc>
  <rect width="720" height="390" rx="18" fill="#f5f9fc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Empat lemparan koin adil</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="16" fill="#475569">Peluang jumlah angka yang muncul</text>
  <path d="M95 310 H660 M95 310 V85" stroke="#6b8295" stroke-width="2"/>
  <path d="M90 310 H660 M90 265 H660 M90 220 H660 M90 175 H660 M90 130 H660 M90 85 H660" stroke="#d5e0e8" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="end">
    <text x="82" y="315">0</text><text x="82" y="270">0,1</text><text x="82" y="225">0,2</text><text x="82" y="180">0,3</text><text x="82" y="135">0,4</text><text x="82" y="90">0,5</text>
  </g>
  <g fill="#1876b8">
    <rect x="142" y="282" width="62" height="28" rx="4"/><rect x="242" y="198" width="62" height="112" rx="4"/>
    <rect x="342" y="141" width="62" height="169" rx="4"/><rect x="442" y="198" width="62" height="112" rx="4"/>
    <rect x="542" y="282" width="62" height="28" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">
    <text x="173" y="275">0,0625</text><text x="273" y="190">0,25</text><text x="373" y="133">0,375</text><text x="473" y="190">0,25</text><text x="573" y="275">0,0625</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#17324d" text-anchor="middle">
    <text x="173" y="337">0</text><text x="273" y="337">1</text><text x="373" y="337">2</text><text x="473" y="337">3</text><text x="573" y="337">4</text>
  </g>
  <text x="352" y="370" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Jumlah angka</text>
</svg>
