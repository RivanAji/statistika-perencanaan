<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Ruang sampel dan kejadian pada satu lemparan dadu</title>
  <desc id="desc">Kotak ruang sampel S berisi enam hasil dadu, 1 sampai 6. Lingkaran kejadian A mengelilingi hasil genap 2, 4, dan 6.</desc>
  <rect width="760" height="390" rx="18" fill="#f5f9fc"/>
  <text x="52" y="52" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Ruang sampel S: semua hasil yang mungkin</text>
  <rect x="38" y="75" width="684" height="270" rx="18" fill="#fff" stroke="#8da8bb" stroke-width="3"/>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#475569">Satu kali melempar dadu</text>
  <ellipse cx="446" cy="228" rx="170" ry="100" fill="#cbe9f5" fill-opacity=".66" stroke="#1876b8" stroke-width="4"/>
  <text x="340" y="173" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1459b5">Kejadian A: hasil genap</text>
  <g font-family="Arial, sans-serif" font-size="25" text-anchor="middle" dominant-baseline="middle" fill="#17324d">
    <circle cx="145" cy="205" r="34" fill="#fff" stroke="#8da8bb" stroke-width="2"/><text x="145" y="205">1</text>
    <circle cx="336" cy="193" r="34" fill="#fff" stroke="#1876b8" stroke-width="2"/><text x="336" y="193">2</text>
    <circle cx="160" cy="285" r="34" fill="#fff" stroke="#8da8bb" stroke-width="2"/><text x="160" y="285">3</text>
    <circle cx="446" cy="228" r="34" fill="#fff" stroke="#1876b8" stroke-width="2"/><text x="446" y="228">4</text>
    <circle cx="650" cy="150" r="34" fill="#fff" stroke="#8da8bb" stroke-width="2"/><text x="650" y="150">5</text>
    <circle cx="556" cy="263" r="30" fill="#fff" stroke="#1876b8" stroke-width="2"/><text x="556" y="263">6</text>
  </g>
  <text x="52" y="372" font-family="Arial, sans-serif" font-size="17" fill="#475569">A = {2, 4, 6}. Lingkaran menunjukkan keanggotaan, bukan besar peluang.</text>
</svg>
