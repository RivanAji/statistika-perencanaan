<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Mean dan median pada data waktu</title>
  <desc id="desc">Delapan titik waktu pada skala 8 sampai 30 menit. Median ditandai garis biru pada 13 menit dan mean garis kuning pada 15 menit; nilai 30 menit membuat mean lebih besar.</desc>
  <rect width="760" height="330" rx="18" fill="#f6fafc"/>
  <text x="54" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Delapan waktu pengamatan</text>
  <line x1="75" y1="238" x2="680" y2="238" stroke="#718096" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="75" y="266">8</text><text x="205" y="266">13</text><text x="257" y="266">15</text><text x="387" y="266">20</text><text x="517" y="266">25</text><text x="647" y="266">30</text>
  </g>
  <g stroke="#718096" stroke-width="2">
    <line x1="75" y1="233" x2="75" y2="243"/><line x1="205" y1="233" x2="205" y2="243"/>
    <line x1="257" y1="233" x2="257" y2="243"/><line x1="387" y1="233" x2="387" y2="243"/>
    <line x1="517" y1="233" x2="517" y2="243"/><line x1="647" y1="233" x2="647" y2="243"/>
  </g>
  <g fill="#1876b8" stroke="#fff" stroke-width="2">
    <circle cx="75" cy="190" r="9"/><circle cx="127" cy="190" r="9"/>
    <circle cx="179" cy="190" r="9"/><circle cx="179" cy="160" r="9"/>
    <circle cx="231" cy="190" r="9"/><circle cx="283" cy="190" r="9"/>
    <circle cx="335" cy="190" r="9"/><circle cx="647" cy="190" r="9"/>
  </g>
  <line x1="205" y1="92" x2="205" y2="222" stroke="#087e8b" stroke-width="4"/>
  <line x1="257" y1="92" x2="257" y2="222" stroke="#d49b18" stroke-width="4" stroke-dasharray="8 6"/>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="188" y="82" fill="#087e8b">Median 13</text>
    <text x="265" y="82" fill="#9b6b00">Mean 15</text>
  </g>
  <text x="75" y="302" font-family="Arial, sans-serif" font-size="15" fill="#475569">Waktu (menit)</text>
  <text x="660" y="302" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#475569">Nilai 30 berada jauh di kanan</text>
</svg>
