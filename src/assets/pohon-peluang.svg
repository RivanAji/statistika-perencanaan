<title id="title">Pohon peluang dua lemparan koin adil</title>
<desc id="desc">Cabang pertama angka atau gambar masing-masing setengah. Setiap cabang bercabang lagi angka atau gambar masing-masing setengah, menghasilkan empat urutan masing-masing seperempat.</desc>
