<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Diagram Venn kejadian Bus dan waktu lebih dari 15 menit</title>
<desc id="desc">Dari delapan perjalanan simulasi, hanya Bus satu, kedua kejadian satu, hanya lebih dari 15 menit dua, di luar keduanya empat.</desc>
<rect x="30" y="32" width="700" height="380" rx="8" fill="#f7fbfc" stroke="#7a9aa3" stroke-width="2"/>
<text x="48" y="65" fill="#173440" font-family="Arial,sans-serif" font-size="19" font-weight="700">Semua perjalanan: 8</text>
<circle cx="315" cy="202" r="128" fill="#76b9ef" fill-opacity=".58" stroke="#1459b5" stroke-width="2"/>
<circle cx="445" cy="202" r="128" fill="#c6e4e9" fill-opacity=".7" stroke="#4a7580" stroke-width="2"/>
<g fill="#173440" font-family="Arial,sans-serif" text-anchor="middle">
<text x="277" y="115" font-size="17">A: Bus</text><text x="486" y="115" font-size="17">B: &gt;15 menit</text>
<text x="261" y="208" font-size="34" font-weight="700">1</text>
<text x="380" y="208" font-size="34" font-weight="700">1</text>
<text x="498" y="208" font-size="34" font-weight="700">2</text>
<text x="380" y="380" font-size="19">Di luar A dan B: 4</text>
</g></svg>
