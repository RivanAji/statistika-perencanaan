<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Dua kejadian dengan irisan</title>
  <desc id="desc">Dua lingkaran bertumpang tindih di dalam ruang sampel. Irisan menunjukkan hasil yang memenuhi A dan B.</desc>
  <rect width="720" height="360" rx="22" fill="#f5f9fc"/>
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="24" fill="#17324d">Ruang sampel S</text>
  <rect x="35" y="78" width="650" height="245" rx="18" fill="#fff" stroke="#8da8bb" stroke-width="3"/>
  <circle cx="300" cy="200" r="96" fill="#55b8d9" fill-opacity=".48" stroke="#1876b8" stroke-width="4"/>
  <circle cx="420" cy="200" r="96" fill="#f4c95d" fill-opacity=".52" stroke="#b78000" stroke-width="4"/>
  <text x="243" y="208" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">A</text>
  <text x="452" y="208" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">B</text>
  <text x="326" y="295" font-family="Arial, sans-serif" font-size="18" fill="#475569">Irisan: A ∩ B</text>
</svg>
